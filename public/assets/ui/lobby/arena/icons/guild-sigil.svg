<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 48" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="guildGold" x1="22" y1="2" x2="22" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9EBBE"/>
      <stop offset=".45" stop-color="#D4A94F"/>
      <stop offset="1" stop-color="#8A6524"/>
    </linearGradient>
    <linearGradient id="guildStone" x1="22" y1="4" x2="22" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C2531"/>
      <stop offset="1" stop-color="#080B10"/>
    </linearGradient>
    <radialGradient id="guildDepth" cx="22" cy="38" r="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B3122E" stop-opacity=".6"/>
      <stop offset="1" stop-color="#B3122E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="guildDoor">
      <path d="M10 46V24a12 12 0 0 1 24 0v22Z"/>
    </clipPath>
  </defs>

  <!-- Corpo de pedra do portal, com o vao escuro da masmorra. -->
  <path d="M5 46V22a17 17 0 0 1 34 0v24Z" fill="url(#guildStone)"/>
  <path d="M10 46V24a12 12 0 0 1 24 0v22Z" fill="#05070A"/>

  <g clip-path="url(#guildDoor)">
    <!-- Brasa vermelha subindo das profundezas. -->
    <rect x="10" y="16" width="24" height="30" fill="url(#guildDepth)"/>
    <!-- Grade levadica: tres barras verticais e duas travessas. -->
    <g stroke="url(#guildGold)" stroke-width="1.5" stroke-linecap="round">
      <path d="M15.4 14v32M22 14v32M28.6 14v32"/>
      <path d="M7 27.5h30M7 35.5h30"/>
    </g>
  </g>

  <!-- Moldura dourada do portal. -->
  <path d="M5 46V22a17 17 0 0 1 34 0v24" stroke="url(#guildGold)" stroke-width="2.3" stroke-linecap="round"/>
  <!-- Rebites da cantaria. -->
  <circle cx="10" cy="10" r="1.5" fill="url(#guildGold)" stroke="#4A3413" stroke-width=".8"/>
  <circle cx="34" cy="10" r="1.5" fill="url(#guildGold)" stroke="#4A3413" stroke-width=".8"/>
  <!-- Chave do arco: a coroa da guilda. -->
  <path d="M22 2.6 26 8.4l-4 5.8-4-5.8Z" fill="url(#guildGold)" stroke="#4A3413" stroke-width="1" stroke-linejoin="round"/>
  <!-- Base de pedra, que assenta o brasao na linha do texto. -->
  <rect x="2.6" y="44.6" width="38.8" height="3.4" rx="1.7" fill="url(#guildGold)" stroke="#4A3413" stroke-width=".9"/>
</svg>
